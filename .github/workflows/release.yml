name: Release

# Push a tag matching app/__init__.py's version (e.g. v1.0.0) to build a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the draft release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Create venv
        run: python -m venv .venv

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(.venv/Scripts/python -c "import app; print(app.__version__)")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app/__init__.py version $v"
            exit 1
          fi

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app and installer
        shell: cmd
        run: build.bat

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true  # review, then publish it on GitHub
          files: dist/GifShelf-*-setup.exe
          fail_on_unmatched_files: true  # never create a release without the installer
